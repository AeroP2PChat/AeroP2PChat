name: Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag (vX.Y.Z)
        required: true
        type: string
      minimum_version:
        description: Minimum accepted version, or empty
        required: false
        default: ""
        type: string
      publish_release:
        description: Publish after the Windows build; otherwise keep the draft
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Validate release input
        shell: pwsh
        run: |
          if ("${{ inputs.tag }}" -notmatch '^v\d+\.\d+\.\d+$') {
            throw "tag must use vX.Y.Z"
          }
          if ("${{ inputs.minimum_version }}" -and "${{ inputs.minimum_version }}" -notmatch '^\d+\.\d+\.\d+$') {
            throw "minimum_version must be empty or X.Y.Z"
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build Windows setup and Store package
        run: node scripts/ci-build-release.cjs --platform=windows --version=${{ inputs.tag }}

      - name: Download Linux release metadata
        shell: pwsh
        run: gh release download "${{ inputs.tag }}" --pattern update_manifest_linux.json --dir dist/build/artifacts

      - name: Build shared update manifest
        shell: pwsh
        run: |
          node scripts/ci-create-latest.cjs dist/build/artifacts --minimum-version=${{ inputs.minimum_version }}
          node scripts/ci-append-linux-latest.cjs dist/build/artifacts/latest.yml dist/build/artifacts

      - name: Preserve Microsoft Store APPX
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-appx-${{ inputs.tag }}
          path: dist/build/artifacts/Aero-P2P-Chat-Microsoft-Store-x64.appx
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows files
        shell: pwsh
        run: |
          gh release upload "${{ inputs.tag }}" `
            dist/build/artifacts/Aero-P2P-Chat-Windows-x64-Setup.exe `
            dist/build/artifacts/update_manifest_windows.json `
            dist/build/artifacts/latest.yml `
            --clobber

      - name: Publish release
        if: ${{ inputs.publish_release }}
        shell: pwsh
        run: gh release edit "${{ inputs.tag }}" --draft=false --latest
